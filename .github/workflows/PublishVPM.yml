name: Publish VPM Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WDT package version (X.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vpm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gridatch/TexTransTool'
    runs-on: ubuntu-latest

    steps:
      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "wdt" ]]; then
            echo "::error::VPM releases may only be published from the wdt branch. Selected ref: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout package image assets
        uses: actions/checkout@v4
        with:
          repository: ReinaS-64892/TTT-ImageAssets
          path: .vpm-build/image-assets

      - name: Checkout VPM repository branch
        uses: actions/checkout@v4
        with:
          ref: vpm
          path: .vpm-build/vpm-repo

      - name: Determine package version
        id: meta
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          base_version="$(jq -r '.version' package.json)"
          package_id="net.gridatch.tex-trans-tool"
          version="$REQUESTED_VERSION"

          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Upstream package version '$base_version' is not a stable X.Y.Z version."
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::WDT package version '$version' must be a stable X.Y.Z version."
            exit 1
          fi

          if jq -e \
            --arg package_id "$package_id" \
            --arg version "$version" \
            '.packages[$package_id].versions[$version] != null' \
            .vpm-build/vpm-repo/vpm.json >/dev/null; then
            echo "::error::VPM version '$version' already exists and is immutable."
            exit 1
          fi

          tag="wdt-v${version}"
          zip="net.gridatch.tex-trans-tool-${version}.zip"
          repo_url="https://raw.githubusercontent.com/gridatch/TexTransTool/vpm/vpm.json"
          download_url="https://github.com/gridatch/TexTransTool/releases/download/${tag}/${zip}"

          {
            echo "base_version=$base_version"
            echo "version=$version"
            echo "tag=$tag"
            echo "zip=$zip"
            echo "repo_url=$repo_url"
            echo "download_url=$download_url"
          } >> "$GITHUB_OUTPUT"

      - name: Build VPM package
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
          REPO_URL: ${{ steps.meta.outputs.repo_url }}
          DOWNLOAD_URL: ${{ steps.meta.outputs.download_url }}
        run: |
          set -euo pipefail

          package_dir="${RUNNER_TEMP}/tex-trans-tool-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='DependentUpdater~' \
            --exclude='.vpm-build' \
            ./ "$package_dir/"

          cp .vpm-build/image-assets/Image/* "$package_dir/Image/"

          jq \
            --arg name "net.gridatch.tex-trans-tool" \
            --arg displayName "TexTransTool (WDT)" \
            --arg version "$VERSION" \
            --arg url "$DOWNLOAD_URL" \
            --arg repo "$REPO_URL" \
            '.name = $name | .displayName = $displayName | .version = $version | .url = $url | .repo = $repo' \
            "$package_dir/package.json" > "$package_dir/package.json.tmp"
          mv "$package_dir/package.json.tmp" "$package_dir/package.json"

          (
            cd "$package_dir"
            zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" ./*
          )

      - name: Create GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          UPSTREAM_VERSION: ${{ steps.meta.outputs.base_version }}
          ZIP_NAME: ${{ steps.meta.outputs.zip }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release tag '$TAG' already exists."
            exit 1
          fi

          gh release create "$TAG" "$ZIP_NAME" \
            --target "$GITHUB_SHA" \
            --title "TexTransTool (WDT) $VERSION" \
            --notes "WDT release $VERSION. Based on upstream TexTransTool $UPSTREAM_VERSION. Source commit: \`$GITHUB_SHA\`."

          sha256="$(sha256sum "$ZIP_NAME" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Add version to VPM repository
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          PACKAGE_JSON: ${{ runner.temp }}/tex-trans-tool-package/package.json
          VPM_JSON: ${{ github.workspace }}/.vpm-build/vpm-repo/vpm.json
          STATE_JSON: ${{ github.workspace }}/.vpm-build/vpm-repo/validation-state.json
          VPM_DIR: ${{ github.workspace }}/.vpm-build/vpm-repo
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import pathlib

          package_json = os.environ["PACKAGE_JSON"]
          vpm_json = os.environ["VPM_JSON"]
          state_json = os.environ["STATE_JSON"]
          vpm_dir = pathlib.Path(os.environ["VPM_DIR"])
          version = os.environ["VERSION"]
          sha256 = os.environ["SHA256"]

          with open(package_json, "r", encoding="utf-8") as f:
              manifest = json.load(f)

          manifest["zipSHA256"] = sha256
          package_id = manifest["name"]

          with open(vpm_json, "r", encoding="utf-8") as f:
              repo = json.load(f)
          with open(state_json, "r", encoding="utf-8") as f:
              state = json.load(f)

          versions = (
              repo.setdefault("packages", {})
                  .setdefault(package_id, {})
                  .setdefault("versions", {})
          )

          previous_debug_version = state.get("currentDebugVersion") or state.get("currentValidationVersion")
          if previous_debug_version:
              versions.pop(previous_debug_version, None)

          for directory, key in (
              ("debug", "currentDebugZip"),
              ("validation", "currentValidationZip"),
          ):
              zip_name = state.get(key)
              if zip_name:
                  zip_path = vpm_dir / directory / zip_name
                  if zip_path.exists():
                      zip_path.unlink()

          if version in versions:
              if versions[version] != manifest:
                  raise SystemExit(
                      f"Refusing to overwrite existing immutable VPM version {version}"
                  )
          else:
              versions[version] = manifest

          state["baseVersion"] = version
          state["lastDebugSerial"] = int(state.get("lastDebugSerial", state.get("lastUsedPatch", 0)))
          for obsolete_key in (
              "versionSeries",
              "lastUsedPatch",
              "currentDebugVersion",
              "currentDebugChange",
              "currentDebugBranch",
              "currentDebugCommit",
              "currentDebugZip",
              "currentValidationVersion",
              "currentValidationBranch",
              "currentValidationCommit",
              "currentValidationZip",
          ):
              state.pop(obsolete_key, None)

          with open(vpm_json, "w", encoding="utf-8", newline="\n") as f:
              json.dump(repo, f, ensure_ascii=False, indent=2)
              f.write("\n")

          with open(state_json, "w", encoding="utf-8", newline="\n") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Publish VPM repository update
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        working-directory: .vpm-build/vpm-repo
        run: |
          set -euo pipefail

          if git diff --quiet -- vpm.json validation-state.json debug validation; then
            echo "VPM repository already contains $VERSION."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vpm.json validation-state.json debug validation
          git commit -m "chore: publish VPM package $VERSION"
          git push origin HEAD:vpm
